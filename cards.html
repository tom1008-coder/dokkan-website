<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartes - Dokkan Dex</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        /* --- COULEURS DOKKAN --- */
        :root {
            --bg-dark: #050a14;
            --bg-panel: #0b1221;
            --bg-input: #151d2e;
            --border: #1f2a40;
            --text-main: #fff;
            --text-muted: #aeb9cc;
            --accent: #ffc107; /* Jaune Dokkan */
            --primary: #3b82f6;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            overflow-y: scroll; /* Évite les sauts de scrollbar */
        }

        /* Scrollbar custom */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        /* --- LAYOUT SIDEBAR + MAIN --- */
        .layout-wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* 1. SIDEBAR DES FILTRES */
        .sidebar-filters {
            width: 300px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            padding: 20px;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            overflow-y: auto;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .sidebar-title {
            color: var(--accent);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-top: 20px;
        }
        .sidebar-title:first-child { margin-top: 0; }

        /* 2. CONTENU PRINCIPAL */
        .main-content {
            flex: 1;
            margin-left: 300px; /* Largeur de la sidebar */
            padding: 20px 30px;
            width: calc(100% - 300px);
        }

        /* --- STYLES DES INPUTS --- */
        .dokkan-label {
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        .dokkan-input {
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            color: #fff;
            font-size: 0.85rem;
            border-radius: 6px;
            width: 100%;
            padding: 8px 12px;
            transition: all 0.2s;
        }
        .dokkan-input:focus {
            background-color: #1a253a;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            outline: none;
        }
        .dokkan-input:disabled {
            background-color: #080c14;
            color: #444;
            cursor: not-allowed;
        }

        /* --- SEARCH BAR HERO --- */
        .hero-search-container {
            background: linear-gradient(to right, var(--bg-panel), var(--bg-dark));
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .hero-search-input {
            background-color: transparent;
            border: none;
            border-bottom: 2px solid var(--border);
            color: #fff;
            font-size: 1.2rem;
            width: 100%;
            padding: 10px;
        }
        .hero-search-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* --- GRILLE CSS GRID (CORRECTION ALIGNEMENT) --- */
        #cards-grid {
            display: grid;
            /* Cela crée autant de colonnes que possible.
               Chaque carte fera au minimum 100px, et grandira pour remplir la ligne */
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px; /* Espacement fixe entre les cartes */
            width: 100%;
        }

        /* --- DESIGN DE LA CARTE --- */
        .card-container {
            /* Plus de marges ici, c'est le gap de la grille qui gère */
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; /* Sécurité */
        }
        
        .card-container:hover {
            transform: translateY(-5px);
            z-index: 5;
        }

        .card-img {
            width: 100%;
            aspect-ratio: 1; /* Force un carré parfait */
            object-fit: cover; /* Remplit le carré sans déformer l'image */
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            background-color: #0b1221;
        }

        .card-name {
            font-size: 0.7rem;
            color: #e2e8f0;
            margin-top: 8px;
            text-align: center;
            line-height: 1.2;
            width: 100%;
            
            /* Coupe le texte s'il est trop long pour garder l'alignement */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- RESPONSIVE (MOBILE) --- */
        @media (max-width: 992px) {
            .sidebar-filters {
                transform: translateX(-100%);
                width: 280px;
                box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            }
            .sidebar-filters.active {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                width: 100%;
                padding: 15px;
            }
            .mobile-filter-btn {
                display: block;
            }
            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0,0,0,0.7);
                z-index: 999;
                backdrop-filter: blur(2px);
            }
            .sidebar-overlay.active { display: block; }
        }

        /* BOUTON MOBILE */
        .mobile-filter-btn {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1050;
            border-radius: 50px;
            padding: 12px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-weight: bold;
        }
        
        #nav-placeholder {
            position: relative;
            z-index: 1001;
        }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="layout-wrapper">
        
        <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

        <aside class="sidebar-filters" id="sidebar">
            <div class="d-flex justify-content-between align-items-center mb-4 d-lg-none">
                <h5 class="text-warning m-0">Filtres</h5>
                <button class="btn btn-sm btn-outline-light" onclick="toggleSidebar()">✕</button>
            </div>

            <div class="sidebar-title">Général</div>
            
            <div class="mb-3">
                <label class="dokkan-label">Rareté</label>
                <select id="filter-rarity" class="dokkan-input">
                    <option value="">Toutes</option>
                    <option value="LR">LR</option>
                    <option value="UR">UR</option>
                    <option value="SSR">SSR</option>
                </select>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="dokkan-label">Type</label>
                    <select id="filter-type" class="dokkan-input">
                        <option value="">Tous</option>
                        <option value="AGI">AGI</option>
                        <option value="TEC">TEC</option>
                        <option value="INT">INT</option>
                        <option value="PUI">PUI</option>
                        <option value="END">END</option>
                    </select>
                </div>
                <div class="col-6">
                    <label class="dokkan-label">Classe</label>
                    <select id="filter-class" class="dokkan-input">
                        <option value="">Toutes</option>
                        <option value="Super">Super</option>
                        <option value="Extreme">Extreme</option>
                    </select>
                </div>
            </div>

            <div class="sidebar-title">Spécifique</div>

            <div class="mb-3">
                <label class="dokkan-label">Catégorie</label>
                <select id="filter-category" class="dokkan-input">
                    <option value="">Toutes les catégories</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="dokkan-label">Personnage</label>
                <select id="filter-character-name" class="dokkan-input">
                    <option value="">Tous</option>
                </select>
            </div>

            <div class="sidebar-title">Éveil</div>

            <div class="row g-2 mb-3">
                <div class="col-12">
                    <label class="dokkan-label text-warning">Z-TUR / Z-LR</label>
                    <select class="dokkan-input" disabled style="border-color: #ffc107;">
                        <option>Bientôt...</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="dokkan-label text-info">Super Z-TUR</label>
                    <select class="dokkan-input" disabled style="border-color: #0dcaf0;">
                        <option>Bientôt...</option>
                    </select>
                </div>
            </div>

            <div class="mt-4 text-center">
                <small class="text-secondary" id="results-count">Chargement...</small>
            </div>
        </aside>

        <main class="main-content">
            
            <div class="hero-search-container">
                <i class="bi bi-search text-warning fs-4"></i>
                <input type="text" id="filter-search" class="hero-search-input" placeholder="Rechercher un personnage (ex: Goku, Broly...)">
            </div>

            <div class="container-fluid p-0">
                <div id="loading-cards" class="text-center py-5">
                    <div class="spinner-border text-warning" style="width: 3rem; height: 3rem;" role="status"></div>
                    <p class="mt-2 text-muted">Chargement des données...</p>
                </div>

                <div id="cards-grid">
                    </div>

                <div id="no-results" class="text-center py-5 d-none">
                    <div class="fs-1 mb-2">🤷‍♂️</div>
                    <h5 class="text-muted">Aucun personnage trouvé avec ces filtres.</h5>
                </div>
            </div>

        </main>
    </div>

    <button class="btn btn-warning mobile-filter-btn d-lg-none" onclick="toggleSidebar()">
        <i class="bi bi-funnel-fill me-1"></i> Filtres
    </button>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <script src="JS/config.js"></script>
    <script src="JS/navbar.js"></script>
    
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.querySelector('.sidebar-overlay').classList.toggle('active');
        }

        fetch("footer.html").then(r=>r.text()).then(h=>{document.getElementById("footer-placeholder").innerHTML=h;});
    </script>

    <script src="JS/cards.js"></script>

</body>
</html>
