<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartes - Dokkan Dex</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* --- DESIGN STYLE DOKKAN BATTLE --- */
        body {
            background-color: #050a14; /* Fond bleu très nuit */
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Zone des filtres */
        .dokkan-filter-area {
            background-color: #0b1221;
            border-bottom: 1px solid #1f2a40;
            padding: 20px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .filter-label {
            color: #aeb9cc;
            font-size: 0.75rem;
            margin-bottom: 4px;
            font-weight: bold;
            text-transform: capitalize;
            display: block;
        }

        /* Style des Selects et Inputs */
        .dokkan-input {
            background-color: #151d2e;
            border: 1px solid #2c3e50;
            color: #fff;
            font-size: 0.8rem;
            border-radius: 4px;
            padding: 0.3rem 0.5rem;
        }
        .dokkan-input:focus {
            background-color: #1a253a;
            border-color: #3b82f6;
            color: #fff;
            box-shadow: none;
        }
        .dokkan-input:disabled {
            background-color: #0f1520;
            color: #555;
            border-color: #1f2a40;
        }

        /* --- LA CARTE (ITEM) --- */
        .card-container {
            text-align: center;
            margin-bottom: 15px; /* Un peu plus d'espace vertical */
            cursor: pointer;
            transition: transform 0.1s;
            /* Important pour que les noms longs ne chevauchent pas */
            height: 100%; 
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        /* Effet de survol léger */
        .card-container:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        .card-icon-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .card-img {
            width: 85%;
            aspect-ratio: 1; /* Carré parfait */
            object-fit: cover;
            border-radius: 6px;
            border: none; 
            background-color: transparent; 
            box-shadow: 0 3px 6px rgba(0,0,0,0.6);
        }

        /* --- MODIFICATION ICI POUR LE NOM --- */
        .card-name {
            color: #ddd;
            font-size: 0.6rem; /* Police un peu plus petite */
            margin-top: 5px;
            line-height: 1.2;
            word-wrap: break-word; /* Coupe les mots trop longs proprement */
        }

        /* --- CLASSE CSS PERSONNALISÉE POUR 12 COLONNES --- */
        @media (min-width: 1200px) {
            .row-cols-custom-12 > * {
                flex: 0 0 auto;
                width: 8.33333333%; /* 100% / 12 */
            }
        }
    </style>
</head>
<body class="text-white">

    <div id="nav-placeholder"></div>

    <div class="dokkan-filter-area sticky-top" style="top: 0; z-index: 100;">
        <div class="container-fluid px-4">
            
            <div class="row g-2 mb-2">
                <div class="col-6 col-md-2">
                    <label class="filter-label">Rareté</label>
                    <select id="filter-rarity" class="form-select form-select-sm dokkan-input">
                        <option value="">Tous</option>
                        <option value="LR">LR</option>
                        <option value="UR">UR</option>
                        <option value="SSR">SSR</option>
                    </select>
                </div>
                <div class="col-6 col-md-2">
                    <label class="filter-label">Type</label>
                    <select id="filter-type" class="form-select form-select-sm dokkan-input">
                        <option value="">Tous</option>
                        <option value="AGI">AGI</option>
                        <option value="TEC">TEC</option>
                        <option value="INT">INT</option>
                        <option value="PUI">PUI</option>
                        <option value="END">END</option>
                    </select>
                </div>
                <div class="col-6 col-md-2">
                    <label class="filter-label">Classe</label>
                    <select id="filter-class" class="form-select form-select-sm dokkan-input">
                        <option value="">Tous</option>
                        <option value="Super">Super</option>
                        <option value="Extreme">Extreme</option>
                    </select>
                </div>
                <div class="col-6 col-md-6">
                    <label class="filter-label">Personnage</label>
                    <select id="filter-character-name" class="form-select form-select-sm dokkan-input">
                        <option value="">Tous</option>
                        </select>
                </div>
            </div>

            <div class="row g-2 align-items-end">
                <div class="col-12 col-md-4">
                    <label class="filter-label">Catégories</label>
                    <select id="filter-category" class="form-select form-select-sm dokkan-input">
                        <option value="">Toutes</option>
                        </select>
                </div>
                
                <div class="col-6 col-md-2">
                    <label class="filter-label">ZTUR / ZLR</label>
                    <select class="form-select form-select-sm dokkan-input" disabled>
                        <option>Tous</option>
                    </select>
                </div>
                <div class="col-6 col-md-2">
                    <label class="filter-label">Super ZTUR</label>
                    <select class="form-select form-select-sm dokkan-input" disabled>
                        <option>Tous</option>
                    </select>
                </div>

                <div class="col-12 col-md-4">
                    <label class="filter-label">Rechercher un nom</label>
                    <input type="text" id="filter-search" class="form-control form-control-sm dokkan-input" placeholder="Entrer un nom...">
                </div>
            </div>

            <div class="text-end mt-1">
                <small class="text-secondary" id="results-count" style="font-size: 0.7rem;">Chargement...</small>
            </div>
        </div>
    </div>

    <div class="container-fluid px-3 mt-4 mb-5">
        <div id="loading-cards" class="text-center py-5">
            <div class="spinner-border text-warning" role="status"></div>
        </div>

        <div id="cards-grid" class="row row-cols-4 row-cols-md-8 row-cols-custom-12 g-2 justify-content-start align-items-start">
            </div>

        <div id="no-results" class="text-center py-5 d-none">
            <h5 class="text-muted">Aucun personnage trouvé.</h5>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <script src="JS/config.js"></script>
    <script src="JS/navbar.js"></script>
    
    <script src="JS/cards.js"></script>
    
    <script>
        fetch("footer.html").then(r=>r.text()).then(h=>{document.getElementById("footer-placeholder").innerHTML=h;});
    </script>
</body>
</html>
