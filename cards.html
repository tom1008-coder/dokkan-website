<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartes - Dokkan Dex</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        /* --- COULEURS ET THÈME DOKKAN --- */
        :root {
            --bg-dark: #030712;
            --bg-panel: #111827;
            --bg-input: #1f2937;
            --border: #374151;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent: #fbbf24; /* Jaune Dokkan */
            --primary: #3b82f6;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            overflow-y: scroll;
        }

        /* Scrollbar custom */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* --- LAYOUT SIDEBAR + MAIN --- */
        .layout-wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* 1. SIDEBAR DES FILTRES */
        .sidebar-filters {
            width: 320px;
            flex-shrink: 0; 
            background-color: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border);
            padding: 25px;
            
            /* Sticky pour s'arrêter avant le footer */
            position: sticky;
            top: 0;
            height: 100vh;
            
            overflow-y: auto;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 4px 0 15px rgba(0,0,0,0.5);
        }

        .sidebar-title {
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
            margin-top: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-title:first-child { margin-top: 0; }

        /* 2. CONTENU PRINCIPAL */
        .main-content {
            flex: 1;
            padding: 30px 40px;
            min-width: 0;
        }

        /* --- STYLES DES INPUTS --- */
        .dokkan-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dokkan-input {
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            color: #fff;
            font-size: 0.9rem;
            border-radius: 8px;
            width: 100%;
            padding: 10px 14px;
            transition: all 0.2s ease;
            appearance: none; 
        }
        .dokkan-input:focus {
            background-color: #273346;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.15);
            outline: none;
        }

        /* --- SEARCH BAR HERO (Non-sticky pour éviter le chevauchement) --- */
        .hero-search-container {
            background: linear-gradient(145deg, var(--bg-panel), #1f2937);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 25px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .hero-search-input {
            background-color: transparent;
            border: none;
            color: #fff;
            font-size: 1.15rem;
            width: 100%;
            font-weight: 500;
        }
        .hero-search-input::placeholder { color: #6b7280; }
        .hero-search-input:focus { outline: none; }

        /* --- GRILLE CSS GRID --- */
        #cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 20px;
            width: 100%;
        }

        /* --- DESIGN DE LA CARTE --- */
        .card-container {
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
        }
        
        .card-icon-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            border: 2px solid #374151;
            transition: transform 0.2s, border-color 0.2s;
            background-color: #1f2937;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-container:hover .card-icon-wrapper {
            transform: translateY(-8px) scale(1.03);
            border-color: var(--accent);
        }

        .card-name {
            font-size: 0.75rem;
            color: #e5e7eb;
            margin-top: 10px;
            text-align: center;
            background-color: rgba(31, 41, 55, 0.8);
            padding: 4px 10px;
            border-radius: 20px;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 1px solid #374151;
            font-weight: 600;
        }

        /* --- RESPONSIVE (MOBILE) --- */
        @media (max-width: 992px) {
            .sidebar-filters {
                position: fixed;
                top: 0; bottom: 0; left: 0;
                height: 100%;
                transform: translateX(-100%);
                width: 300px;
            }
            .sidebar-filters.active { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 15px; }
            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0,0,0,0.8);
                z-index: 999;
                backdrop-filter: blur(3px);
            }
            .sidebar-overlay.active { display: block; }
        }

        .mobile-filter-btn {
            display: none;
            position: fixed;
            bottom: 25px; right: 25px;
            z-index: 1050;
            border-radius: 50px;
            padding: 14px 24px;
            box-shadow: 0 8px 25px rgba(251, 191, 36, 0.4);
            font-weight: 800;
        }
        
        @media (max-width: 992px) { .mobile-filter-btn { display: flex; } }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="layout-wrapper">
        
        <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

        <aside class="sidebar-filters" id="sidebar">
            <div class="d-flex justify-content-between align-items-center mb-4 d-lg-none">
                <h5 class="text-warning fw-bold m-0"><i class="bi bi-funnel-fill me-2"></i>Filtres</h5>
                <button class="btn btn-sm btn-outline-light rounded-circle" onclick="toggleSidebar()"><i class="bi bi-x-lg"></i></button>
            </div>

            <div class="sidebar-title"><i class="bi bi-sliders"></i> Général</div>
            
            <div class="mb-4">
                <label class="dokkan-label"><i class="bi bi-star-fill text-warning"></i> Rareté</label>
                <select id="filter-rarity" class="dokkan-input">
                    <option value="">Toutes les raretés</option>
                    <option value="LR">LR (Légendaire)</option>
                    <option value="UR">UR (Ultra Rare)</option>
                </select>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-6">
                    <label class="dokkan-label">Type</label>
                    <select id="filter-type" class="dokkan-input">
                        <option value="">Tous</option>
                        <option value="AGI">AGI</option>
                        <option value="TEC">TEC</option>
                        <option value="INT">INT</option>
                        <option value="PUI">PUI</option>
                        <option value="END">END</option>
                    </select>
                </div>
                <div class="col-6">
                    <label class="dokkan-label">Classe</label>
                    <select id="filter-class" class="dokkan-input">
                        <option value="">Toutes</option>
                        <option value="Super">Super</option>
                        <option value="Extreme">Extreme</option>
                    </select>
                </div>
            </div>

            <div class="sidebar-title"><i class="bi bi-bookmark-star"></i> Spécifique</div>

            <div class="mb-4">
                <label class="dokkan-label">Catégorie</label>
                <select id="filter-category" class="dokkan-input">
                    <option value="">Toutes les catégories</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="dokkan-label">Personnage</label>
                <select id="filter-character-name" class="dokkan-input">
                    <option value="">Tous les noms</option>
                </select>
            </div>

            <div class="sidebar-title"><i class="bi bi-lightning-charge text-warning"></i> Éveil</div>

            <div class="mb-4">
                <label class="dokkan-label text-warning">Niveau d'éveil</label>
                <select id="filter-awakening" class="dokkan-input" style="border-color: #fbbf24;">
                    <option value="">Tous</option>
                    <option value="ztur">Z-TUR</option>
                    <option value="zlr">Z-LR</option>
                    <option value="seza">Super EZA (SEZA)</option>
                </select>
            </div>

            <div class="mt-5 text-center p-3 rounded" style="background-color: rgba(255,255,255,0.02); border: 1px dashed var(--border);">
                <span class="text-warning fw-bold fs-5 d-block mb-1" id="results-count">0</span>
                <small class="text-secondary">Cartes correspondantes</small>
            </div>
        </aside>

        <main class="main-content">
            
            <div class="hero-search-container">
                <i class="bi bi-search text-warning fs-3"></i>
                <input type="text" id="filter-search" class="hero-search-input" placeholder="Rechercher un personnage (ex: Goku, Broly...)">
            </div>

            <div class="container-fluid p-0">
                <div id="loading-cards" class="text-center py-5 my-5">
                    <div class="spinner-border text-warning" style="width: 4rem; height: 4rem;" role="status"></div>
                    <h5 class="mt-4 text-white-50 fw-light">Récupération de la box...</h5>
                </div>

                <div id="cards-grid"></div>

                <div id="no-results" class="text-center py-5 my-5 d-none">
                    <div class="display-1 mb-3 text-muted"><i class="bi bi-emoji-frown"></i></div>
                    <h4 class="text-light fw-bold">Aucune carte trouvée</h4>
                </div>
            </div>

        </main>
    </div>

    <button class="btn btn-warning mobile-filter-btn" onclick="toggleSidebar()">
        <i class="bi bi-funnel-fill"></i> Filtres
    </button>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="JS/config.js"></script>
    <script src="JS/navbar.js"></script>
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.querySelector('.sidebar-overlay').classList.toggle('active');
        }
        fetch("footer.html").then(r=>r.text()).then(h=>{document.getElementById("footer-placeholder").innerHTML=h;});
    </script>
    <script src="JS/cards.js"></script>

</body>
</html>
