<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Builder - Dokkan Dex</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="CSS/team.css">
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="container-fluid px-md-4 px-lg-5 mt-4 mb-5">
        
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-2">
            <h2 class="text-warning fw-bold mb-0"><i class="bi bi-diagram-3-fill"></i> CRÉATEUR D'ÉQUIPE</h2>
            <button class="btn btn-sm btn-outline-danger" onclick="viderEquipe()">Vider l'équipe</button>
        </div>

        <div class="d-flex justify-content-center overflow-auto mb-5">
            <div class="team-board shadow-lg">
                
                <svg class="team-links-svg" width="1000" height="600">
                    <line id="line-0-1" x1="150" y1="150" x2="450" y2="150" class="link-line" />
                    <g id="badge-0-1" class="link-badge" transform="translate(300, 150)" style="display: none;">
                        <circle r="14" /><text id="text-0-1">0</text>
                    </g>

                    <line id="line-1-2" x1="450" y1="150" x2="750" y2="150" class="link-line" />
                    <g id="badge-1-2" class="link-badge" transform="translate(600, 150)" style="display: none;">
                        <circle r="14" /><text id="text-1-2">0</text>
                    </g>

                    <line id="line-6-3" x1="150" y1="450" x2="450" y2="450" class="link-line" />
                    <g id="badge-6-3" class="link-badge" transform="translate(300, 450)" style="display: none;">
                        <circle r="14" /><text id="text-6-3">0</text>
                    </g>

                    <line id="line-3-4" x1="450" y1="450" x2="750" y2="450" class="link-line" />
                    <g id="badge-3-4" class="link-badge" transform="translate(600, 450)" style="display: none;">
                        <circle r="14" /><text id="text-3-4">0</text>
                    </g>

                    <line id="line-1-4" x1="450" y1="150" x2="750" y2="450" class="link-line" />
                    <g id="badge-1-4" class="link-badge" transform="translate(550, 250)" style="display: none;">
                        <circle r="14" /><text id="text-1-4">0</text>
                    </g>

                    <line id="line-2-3" x1="750" y1="150" x2="450" y2="450" class="link-line" />
                    <g id="badge-2-3" class="link-badge" transform="translate(550, 350)" style="display: none;">
                        <circle r="14" /><text id="text-2-3">0</text>
                    </g>

                    <line id="line-1-5" x1="450" y1="150" x2="900" y2="300" class="link-line" />
                    <g id="badge-1-5" class="link-badge" transform="translate(675, 225)" style="display: none;">
                        <circle r="14" /><text id="text-1-5">0</text>
                    </g>

                    <line id="line-3-5" x1="450" y1="450" x2="900" y2="300" class="link-line" />
                    <g id="badge-3-5" class="link-badge" transform="translate(675, 375)" style="display: none;">
                        <circle r="14" /><text id="text-3-5">0</text>
                    </g>
                </svg>


                <div class="team-slot" id="slot-0" style="left: 150px; top: 150px;" onclick="selectionnerSlot(0)">
                    <div class="badge-add">LEADER</div><i class="bi bi-plus-lg text-white-50"></i>
                </div>
                <div class="team-slot" id="slot-1" style="left: 450px; top: 150px;" onclick="selectionnerSlot(1)">
                    <div class="badge-add">SUB 1</div><i class="bi bi-plus-lg text-white-50"></i>
                </div>
                <div class="team-slot" id="slot-2" style="left: 750px; top: 150px;" onclick="selectionnerSlot(2)">
                    <div class="badge-add">SUB 2</div><i class="bi bi-plus-lg text-white-50"></i>
                </div>

                <div class="team-slot" id="slot-6" style="left: 150px; top: 450px;" onclick="selectionnerSlot(6)">
                    <div class="badge-add">AMI</div><i class="bi bi-plus-lg text-white-50"></i>
                </div>
                <div class="team-slot" id="slot-3" style="left: 450px; top: 450px;" onclick="selectionnerSlot(3)">
                    <div class="badge-add">SUB 3</div><i class="bi bi-plus-lg text-white-50"></i>
                </div>
                <div class="team-slot" id="slot-4" style="left: 750px; top: 450px;" onclick="selectionnerSlot(4)">
                    <div class="badge-add">SUB 4</div><i class="bi bi-plus-lg text-white-50"></i>
                </div>

                <div class="team-slot" id="slot-5" style="left: 900px; top: 300px;" onclick="selectionnerSlot(5)">
                    <div class="badge-add">SUB 5</div><i class="bi bi-plus-lg text-white-50"></i>
                </div>

            </div>
        </div>
    </div>

    <div class="modal fade" id="rosterModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl modal-dialog-scrollable">
            <div class="modal-content border-secondary shadow-lg" style="background-color: #111827;">
                <div class="modal-header border-secondary" style="background-color: #1f2937;">
                    <h5 class="modal-title text-warning fw-bold"><i class="bi bi-person-lines-fill"></i> CHOISIR UN PERSONNAGE</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fermer"></button>
                </div>
                <div class="modal-body p-4" style="background-color: #0b101a;">
                    <div class="mb-4">
                        <input type="text" id="roster-search" class="form-control bg-dark text-white border-secondary" placeholder="Rechercher...">
                    </div>
                    <div id="roster-container" class="row row-cols-3 row-cols-sm-4 row-cols-md-6 row-cols-xl-8 g-2 justify-content-center">
                        <div class="col-12 text-center py-5 w-100">
                            <div class="spinner-border text-primary"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="link-tooltip" class="link-tooltip" style="display: none;"></div>

    <div id="footer-placeholder"></div>

    <script>
        fetch("nav.html").then(res => res.text()).then(html => { document.getElementById("nav-placeholder").innerHTML = html; });
        fetch("footer.html").then(res => res.text()).then(html => { document.getElementById("footer-placeholder").innerHTML = html; });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="JS/config.js"></script>
    <script src="JS/team.js"></script>
    <script src="JS/navbar.js"></script>
</body>
</html>
