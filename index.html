<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dokkan Battle Dex</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="CSS/index_style.css">
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="container-fluid px-md-4 px-lg-5 mt-4 mb-5">
        <div class="row g-4">
            
            <div class="col-lg-8 col-xl-9">
                
                <div class="dokkan-section-title">LES CARTES QUI ARRIVENT</div>
                <div class="row g-3 mb-5">
                    <div class="col-sm-6 col-md-4">
                        <div class="banner-arrival">
                            <img src="img/dokkan.jpg" class="img-fluid" alt="Coming Soon">
                            <div class="arrival-date">Prochainement</div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-4 d-none d-sm-block">
                        <div class="banner-arrival">
                            <img src="img/dokkan.jpg" class="img-fluid" alt="Coming Soon">
                            <div class="arrival-date">Prochainement</div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-4 d-none d-md-block">
                        <div class="banner-arrival">
                            <img src="img/dokkan.jpg" class="img-fluid" alt="Coming Soon">
                            <div class="arrival-date">Prochainement</div>
                        </div>
                    </div>
                </div>

                <div class="dokkan-section-title">LES DERNIÈRES CARTES / EVEILS SORTIES </div>
                
                <div id="card-container" class="row row-cols-3 row-cols-sm-4 row-cols-md-4 row-cols-xl-4 g-3 mb-5">
                    <div class="col-12 w-100 text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="text-secondary mt-2">Chargement des données...</p>
                    </div>
                </div>

            </div>

            <div class="col-lg-4 col-xl-3">
                <div class="dokkan-section-title side-title">LES DERNIÈRES NEWS</div>
                
                <div class="news-sidebar" id="news-container">
                    <div class="text-center py-5">
                        <div class="spinner-border text-secondary spinner-border-sm" role="status"></div>
                        <p class="text-secondary small mt-2">Chargement des news...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="modal fade" id="newsModal" tabindex="-1" aria-labelledby="newsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content text-light border-secondary" style="background-color: #111827;">
                
                <div class="modal-header border-secondary" style="background-color: #1f2937;">
                    <h5 class="modal-title fw-bold" id="modalNewsTitle">Titre de la News</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <div class="modal-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom border-secondary">
                        <span id="modalNewsBadge" class="badge">BADGE</span>
                        <span id="modalNewsDate" class="text-white-50 small"><i class="bi bi-clock"></i> Date</span>
                    </div>
                    
                    <div id="modalNewsImageContainer" class="text-center mb-4" style="display: none;">
                        <img id="modalNewsImage" src="" class="img-fluid rounded border border-secondary shadow" alt="News Image">
                    </div>
                    
                    <div id="modalNewsContent" class="text-light opacity-75" style="line-height: 1.6; white-space: pre-wrap; font-size: 0.95rem;">
                        Contenu de la news...
                    </div>
                </div>
                
                <div class="modal-footer border-secondary" style="background-color: #0d1117;">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Fermer</button>
                </div>
                
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script>
        fetch("nav.html")
            .then(response => response.text())
            .then(html => { document.getElementById("nav-placeholder").innerHTML = html; })
            .catch(err => console.error("Erreur chargement nav :", err));

        fetch("footer.html")
            .then(response => response.text())
            .then(html => { document.getElementById("footer-placeholder").innerHTML = html; })
            .catch(err => console.error("Erreur chargement footer :", err));
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="JS/config.js"></script>
    <script src="JS/script.js"></script>
    <script src="JS/navbar.js"></script>

</body>
</html>
