<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Box - Dokkan Dex</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/index_style.css">
</head>
<body class="bg-dark">

    <div id="nav-placeholder"></div>

    <div class="container mt-5 pt-4 mb-5 flex-grow-1">
        
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-warning pb-3 flex-wrap gap-3">
            <h2 class="text-warning fw-bold mb-0" id="box-title">📦 MA BOX</h2>
            <div class="d-flex align-items-center gap-3">
                <span class="badge bg-warning text-dark fs-6" id="box-count">0 Cartes</span>
                <a href="add_box.html" id="btn-add-card" class="btn btn-warning fw-bold">➕ Ajouter</a>
            </div>
        </div>

        <div id="box-grid" class="row g-3">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-warning" role="status"></div>
                <p class="text-secondary mt-2">Chargement de la Box...</p>
            </div>
        </div>
        
    </div>

    <div id="footer-placeholder"></div>

    <script>
        fetch("nav.html").then(res => res.text()).then(html => document.getElementById("nav-placeholder").innerHTML = html);
        fetch("footer.html").then(res => res.text()).then(html => document.getElementById("footer-placeholder").innerHTML = html);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="JS/config.js"></script>
    <script src="JS/navbar.js"></script>
    <script src="JS/box.js"></script>
</body>
</html>
