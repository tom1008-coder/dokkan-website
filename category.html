<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catégorie - Dokkan Battle Dex</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/category.css">
</head>
<body class="bg-dark text-light">

    <div id="nav-placeholder"></div>

    <div class="container mt-5">
        
        <div class="mb-5 pb-3 border-bottom border-secondary">
            <a href="index.html" class="btn btn-outline-light mb-3">← Retour à l'accueil</a>
            <h1 class="fw-bold">
                <span class="text-secondary h4">Catégorie :</span> <br>
                <span id="category-title" class="text-warning display-5">Chargement...</span>
            </h1>
            <p class="text-white-50" id="result-count">Recherche en cours...</p>
        </div>

        <div class="mb-5">
            <h3 class="text-info fw-bold mb-4 border-start border-4 border-info ps-3">
                👑 Leaders Catégorie
            </h3>
            <div id="leaders-container" class="row">
                <div class="text-center text-secondary fst-italic">Aucun leader spécifique trouvé.</div>
            </div>
        </div>

        <div class="mb-5">
            <h3 class="text-white fw-bold mb-4 border-start border-4 border-secondary ps-3">
                👥 Tous les Personnages
            </h3>
            <div id="members-container" class="row">
                <div class="text-center mt-3">
                    <div class="spinner-border text-warning" role="status"></div>
                </div>
            </div>
        </div>

    </div>

    <div id="footer-placeholder"></div>

    <script>
        fetch("nav.html").then(res => res.text()).then(html => document.getElementById("nav-placeholder").innerHTML = html);
        fetch("footer.html").then(res => res.text()).then(html => document.getElementById("footer-placeholder").innerHTML = html);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="JS/config.js"></script>
    <script src="JS/category.js"></script>
    <script src="JS/navbar.js"></script>

</body>
</html>
