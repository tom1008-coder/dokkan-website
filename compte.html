<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil - Dokkan Dex</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/compte.css">
    <style>
        /* Effets visuels pour les statistiques */
        .interactive-stat-card {
            transition: all 0.3s ease-in-out;
            cursor: default;
        }

        /* Halo jaune au survol de la carte */
        .interactive-stat-card:hover {
            box-shadow: 0 0 25px rgba(255, 193, 7, 0.3);
            border-color: rgba(255, 193, 7, 0.6) !important;
        }

        /* Style du bouton "éteint" par défaut */
        .stat-btn {
            background-color: transparent;
            border: 1px solid #6c757d;
            color: #6c757d;
            transition: all 0.3s ease-in-out;
            text-decoration: none;
            display: inline-block;
        }

        /* Le bouton s'allume quand on survole la CARTE */
        .interactive-stat-card:hover .stat-btn {
            border-color: #ffc107;
            color: #ffc107;
            box-shadow: 0 0 10px rgba(255, 193, 7, 0.2);
        }

        /* Le bouton change de fond quand on le survole LUI-MÊME */
        .stat-btn:hover {
            background-color: #ffc107 !important;
            color: #1a1f2b !important;
        }
    </style>
</head>
<body class="bg-dark text-light">

    <div id="nav-placeholder"></div>

    <div class="container mt-5 mb-5 flex-grow-1">
        
        <div id="alert-area"></div>

        <div id="loading-profile" class="text-center py-5">
            <div class="spinner-border text-warning" role="status"></div>
            <p class="mt-2 text-white">Chargement du profil...</p>
        </div>

        <div id="profile-content" class="row justify-content-center d-none">
            <div class="col-lg-8">
                
                <div class="card bg-dark border-secondary mb-4">
    <div class="card-header border-bottom border-secondary bg-secondary bg-opacity-25 py-3">
        <h4 class="mb-0 text-warning fw-bold">👤 MON PROFIL</h4>
    </div>
    <div class="card-body p-4">
        <div class="mb-4">
            <label class="text-secondary text-uppercase small fw-bold mb-1">Pseudonyme actuel</label>
            <div class="fs-4 fw-bold text-white" id="display-pseudo">Chargement...</div>
        </div>
        <div class="row g-3">
            <div class="col-md-6">
                <label class="text-secondary text-uppercase small fw-bold mb-1">Email</label>
                <p id="user-email-display" class="mb-0 text-white">...</p>
            </div>
            <div class="col-md-6">
                <label class="text-secondary text-uppercase small fw-bold mb-1">Membre depuis le</label>
                <p id="user-date-display" class="mb-0 text-white">...</p>
            </div>
        </div>
    </div>
</div>

                <div class="card bg-dark border-secondary mb-4">
                    <div class="card-header border-bottom border-secondary bg-secondary bg-opacity-25 py-3">
                        <h5 class="mb-0 text-info fw-bold">🛠️ PARAMÈTRES DU COMPTE</h5>
                    </div>
                    <div class="card-body p-4">
                        
                        <form id="form-pseudo" class="mb-4 border-bottom border-secondary pb-4">
                            <label class="form-label text-warning fw-bold">Changer mon Pseudonyme</label>
                            <div class="input-group">
                                <input type="text" id="input-pseudo" class="form-control bg-dark text-white border-secondary" placeholder="Nouveau pseudo">
                                <button class="btn btn-outline-warning" type="submit">Sauvegarder</button>
                            </div>
                        </form>

                        <form id="form-password">
                            <label class="form-label text-danger fw-bold">Changer mon Mot de Passe</label>
                            <div class="mb-2">
                                <input type="password" id="input-password" class="form-control bg-dark text-white border-secondary" placeholder="Nouveau mot de passe">
                            </div>
                            <div class="mb-3">
                                <input type="password" id="input-password-confirm" class="form-control bg-dark text-white border-secondary" placeholder="Confirmer">
                            </div>
                            <button type="submit" class="btn btn-outline-danger w-100">Mettre à jour</button>
                        </form>
                    </div>
                </div>

                <h5 class="mb-3 ps-1 border-start border-4 border-warning ps-2 mt-5">MES STATISTIQUES</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="p-4 rounded interactive-stat-card text-center h-100 d-flex flex-column justify-content-center bg-dark border border-secondary">
                            <div class="display-5 fw-bold text-warning" id="stat-box-count">0</div>
                            <div class="text-white small text-uppercase mt-2 mb-3">Cartes dans la Box</div>
                            <div>
                                <a href="box.html" class="btn btn-sm stat-btn px-4 py-1 fw-bold">Voir ma Box</a>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="p-4 rounded text-center h-100 d-flex flex-column justify-content-center bg-dark border border-secondary opacity-75">
                            <div class="display-5 fw-bold text-info" id="stat-team-count">0</div>
                            <div class="text-white small text-uppercase mt-2 mb-3">Équipes créées</div>
                            <div>
                                <button class="btn btn-sm btn-outline-secondary disabled px-4 py-1">Bientôt disponible</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="JS/config.js"></script>
    <script src="JS/navbar.js"></script>

    <script>
        function showAlert(msg, type) {
            const alertArea = document.getElementById('alert-area');
            alertArea.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">${msg}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'auth.html'; return; }

            const user = session.user;
            document.getElementById('user-email-display').textContent = user.email;
            
            const dateCreation = new Date(user.created_at);
            document.getElementById('user-date-display').textContent = dateCreation.toLocaleDateString('fr-FR', { year: 'numeric', month: 'long', day: 'numeric' });

            const currentPseudo = user.user_metadata.display_name || "Non défini";
            document.getElementById('display-pseudo').textContent = currentPseudo;
            if(user.user_metadata.display_name) document.getElementById('input-pseudo').value = user.user_metadata.display_name;

            // --- LOGIQUE COMPTEUR DE BOX ---
            try {
                const { count, error: boxError } = await supabase
                    .from('user_box')
                    .select('*', { count: 'exact', head: true })
                    .eq('user_id', user.id);

                if (boxError) throw boxError;
                document.getElementById('stat-box-count').textContent = count || 0;
            } catch (err) {
                console.error("Erreur box:", err);
                document.getElementById('stat-box-count').textContent = "!";
            }

            document.getElementById('loading-profile').classList.add('d-none');
            document.getElementById('profile-content').classList.remove('d-none');

            // --- FORMULAIRES ---
            document.getElementById('form-pseudo').addEventListener('submit', async (e) => {
                e.preventDefault();
                const newPseudo = document.getElementById('input-pseudo').value.trim();
                const { error } = await supabase.auth.updateUser({ data: { display_name: newPseudo } });
                if (error) showAlert(error.message, "danger");
                else { showAlert("Pseudo mis à jour !", "success"); setTimeout(() => location.reload(), 800); }
            });

            document.getElementById('form-password').addEventListener('submit', async (e) => {
                e.preventDefault();
                const pass1 = document.getElementById('input-password').value;
                const pass2 = document.getElementById('input-password-confirm').value;
                if (pass1 !== pass2) return showAlert("Les mots de passe diffèrent.", "danger");
                const { error } = await supabase.auth.updateUser({ password: pass1 });
                if (error) showAlert(error.message, "danger");
                else { showAlert("Mot de passe modifié !", "success"); document.getElementById('form-password').reset(); }
            });
        });
    </script>
</body>
</html>
