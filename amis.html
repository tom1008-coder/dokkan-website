<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Amis - Dokkan Dex</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/index_style.css">
    <link rel="stylesheet" href="CSS/compte.css">
</head>
<body class="bg-dark">

    <div id="nav-placeholder"></div>

    <div class="container mt-5 pt-4 mb-5 flex-grow-1">
        <h2 class="text-warning fw-bold mb-4">👥 SYSTÈME D'AMIS</h2>

        <div class="row g-4">
            <div class="col-md-5">
                
                <div class="card p-4 mb-4" style="background: rgba(20, 25, 35, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 193, 7, 0.3);">
                    <h5 class="text-warning mb-3">Ajouter un ami</h5>
                    <div class="position-relative">
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-warning border-end-0">🔍</span>
                            <input type="text" id="search-friend-input" class="form-control bg-dark text-light border-secondary border-start-0" placeholder="Taper un pseudo..." autocomplete="off">
                        </div>
                        
                        <ul id="search-dropdown" class="list-group position-absolute w-100 d-none shadow-lg" style="z-index: 1000; top: 100%; max-height: 250px; overflow-y: auto;">
                            </ul>
                    </div>
                </div>

                <div class="card p-4" style="background: rgba(20, 25, 35, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(13, 202, 240, 0.3);">
                    <h5 class="text-info mb-3">Demandes reçues</h5>
                    <div id="pending-requests-container">
                        <div class="text-center py-3">
                            <div class="spinner-border spinner-border-sm text-info" role="status"></div>
                        </div>
                    </div>
                </div>

            </div>

            <div class="col-md-7">
                <div class="card p-4 h-100" style="background: rgba(20, 25, 35, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1);">
                    <h5 class="text-white border-bottom border-secondary pb-2 mb-3">Ma Liste d'Amis</h5>
                    <div id="friends-list-container" class="row g-3">
                        <div class="col-12 text-center py-3">
                            <div class="spinner-border text-warning" role="status"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div id="footer-placeholder"></div>

    <script>
        fetch("nav.html").then(res => res.text()).then(html => document.getElementById("nav-placeholder").innerHTML = html);
        fetch("footer.html").then(res => res.text()).then(html => document.getElementById("footer-placeholder").innerHTML = html);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <script src="JS/config.js"></script>
    <script src="JS/navbar.js"></script> <script src="JS/amis.js"></script>
    
</body>
</html>
