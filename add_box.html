<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter à ma Box - Dokkan Dex</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/index_style.css">
    <style>
        /* Style inspiré de ta capture d'écran */
        .search-bar-container {
            background-color: #0b101a;
            border-radius: 8px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            border: 1px solid #1c2538;
            margin-bottom: 30px;
        }
        .search-bar-container i {
            font-style: normal;
            font-size: 1.2rem;
            color: #ffc107; /* Couleur jaune de la loupe */
            margin-right: 15px;
        }
        .search-bar-container input {
            background: transparent;
            border: none;
            color: #ffffff;
            width: 100%;
            font-size: 1rem;
        }
        .search-bar-container input:focus {
            outline: none;
        }
        .search-bar-container input::placeholder {
            color: #6b7280;
        }

        /* Grille des personnages (Responsive) */
        .dokkan-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 20px 15px;
        }

        /* Carte Personnage */
        .dokkan-char-card {
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        .dokkan-char-card:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }
        .dokkan-char-img {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid #2a3449;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            margin-bottom: 8px;
            background-color: #1a1f2b; /* Fond par défaut si l'image charge */
        }
        .dokkan-char-name {
            color: #e5e7eb;
            font-size: 0.75rem;
            line-height: 1.2;
            /* Coupe le texte s'il est trop long (2 lignes max) */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Petit message de notification flottant */
        #toast-notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #198754;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 1050;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
        }
        #toast-notification.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-dark">

    <div id="nav-placeholder"></div>

    <div class="container-fluid px-4 px-md-5 mt-5 pt-4 mb-5 flex-grow-1">
        
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2">
            <h3 class="text-warning fw-bold mb-0">AJOUTER À LA BOX</h3>
            <a href="box.html" class="btn btn-outline-light btn-sm fw-bold">← Retour à ma Box</a>
        </div>

        <div class="search-bar-container shadow-lg">
            <i>🔍</i>
            <input type="text" id="search-char-input" placeholder="Rechercher un personnage (ex: Goku, Broly...)" autocomplete="off">
        </div>

        <div id="character-grid" class="dokkan-grid">
            </div>
        
        <div id="loading-spinner" class="text-center py-5 d-none">
            <div class="spinner-border text-warning" role="status"></div>
        </div>

    </div>

    <div id="footer-placeholder"></div>

    <div id="toast-notification">✅ Carte ajoutée à la Box !</div>

    <script>
        fetch("nav.html").then(res => res.text()).then(html => document.getElementById("nav-placeholder").innerHTML = html);
        fetch("footer.html").then(res => res.text()).then(html => document.getElementById("footer-placeholder").innerHTML = html);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="JS/config.js"></script>
    <script src="JS/navbar.js"></script>
    <script src="JS/add_box.js"></script>
</body>
</html>
